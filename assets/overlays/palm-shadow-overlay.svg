<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softEdge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- one palm frond: a rib with tapered leaflets, drawn as a reusable symbol -->
    <g id="leaflet">
      <path d="M0,0 C 40,-6 120,-10 220,-4 C 130,4 50,8 0,0 Z"/>
    </g>
    <g id="frond">
      <path d="M0,0 C 150,-4 320,-2 480,4" stroke="#0C1420" stroke-width="4" fill="none"/>
      <use href="#leaflet" transform="translate(40,-2) rotate(-28) scale(0.9)"/>
      <use href="#leaflet" transform="translate(90,-3) rotate(-18) scale(1.05)"/>
      <use href="#leaflet" transform="translate(150,-3) rotate(-8) scale(1.15)"/>
      <use href="#leaflet" transform="translate(210,-1) rotate(2) scale(1.2)"/>
      <use href="#leaflet" transform="translate(270,1) rotate(12) scale(1.15)"/>
      <use href="#leaflet" transform="translate(330,2) rotate(22) scale(1.05)"/>
      <use href="#leaflet" transform="translate(390,3) rotate(30) scale(0.9)"/>
      <use href="#leaflet" transform="translate(40,-4) rotate(-45) scale(0.85)"/>
      <use href="#leaflet" transform="translate(100,-5) rotate(-38) scale(1)"/>
      <use href="#leaflet" transform="translate(170,-5) rotate(-28) scale(1.1)"/>
      <use href="#leaflet" transform="translate(240,-4) rotate(-16) scale(1.1)"/>
      <use href="#leaflet" transform="translate(40,3) rotate(45) scale(0.85)"/>
      <use href="#leaflet" transform="translate(100,5) rotate(38) scale(1)"/>
      <use href="#leaflet" transform="translate(170,6) rotate(30) scale(1.1)"/>
      <use href="#leaflet" transform="translate(240,5) rotate(20) scale(1.1)"/>
    </g>
  </defs>

  <!-- dappled palm-shadow cast, corners only, dark low-opacity so it sits subtly over a photo -->
  <g fill="#0C1420" fill-opacity="0.4" filter="url(#softEdge)">
    <use href="#frond" transform="translate(-40,60) rotate(18) scale(1.6)"/>
    <use href="#frond" transform="translate(-60,180) rotate(48) scale(1.4)"/>
    <use href="#frond" transform="translate(-30,-30) rotate(-10) scale(1.5)"/>
  </g>
  <g fill="#0C1420" fill-opacity="0.28" filter="url(#softEdge)">
    <use href="#frond" transform="translate(1560,900) rotate(-160) scale(1.7)"/>
    <use href="#frond" transform="translate(1650,1020) rotate(-135) scale(1.3)"/>
  </g>
</svg>
