<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <radialGradient id="wisp1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3ECDD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3ECDD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFCF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFCF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft mist banks, bottom-weighted so it reads as ground haze over a photo/video -->
  <g filter="url(#soft)">
    <ellipse cx="300" cy="950" rx="500" ry="180" fill="url(#wisp1)"/>
    <ellipse cx="900" cy="1000" rx="650" ry="200" fill="url(#wisp2)"/>
    <ellipse cx="1550" cy="920" rx="550" ry="190" fill="url(#wisp1)"/>
    <ellipse cx="1250" cy="750" rx="400" ry="140" fill="url(#wisp2)" opacity="0.7"/>
    <ellipse cx="450" cy="700" rx="380" ry="130" fill="url(#wisp1)" opacity="0.6"/>
  </g>
</svg>
