<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="rain" width="140" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="20" y1="0" x2="10" y2="100" stroke="#F3ECDD" stroke-opacity="0.09" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="75" y1="30" x2="65" y2="150" stroke="#F3ECDD" stroke-opacity="0.06" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="105" y1="-15" x2="97" y2="90" stroke="#F3ECDD" stroke-opacity="0.07" stroke-width="1.3" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="rainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="rainMask">
      <rect x="0" y="0" width="1920" height="1080" fill="white"/>
    </mask>
  </defs>
  <rect x="-100" y="-100" width="2120" height="1280" fill="url(#rain)"/>
  <!-- a few brighter streaks for depth, as if lit from the side -->
  <g stroke="#FFFCF8" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round">
    <line x1="220" y1="-40" x2="140" y2="360" transform="rotate(12 220 -40)"/>
    <line x1="820" y1="-40" x2="740" y2="420" transform="rotate(12 820 -40)"/>
    <line x1="1420" y1="-40" x2="1340" y2="380" transform="rotate(12 1420 -40)"/>
    <line x1="1720" y1="-40" x2="1640" y2="340" transform="rotate(12 1720 -40)"/>
  </g>
</svg>
