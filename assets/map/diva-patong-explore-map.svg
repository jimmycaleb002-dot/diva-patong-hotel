<svg viewBox="0 0 1500 1700" xmlns="http://www.w3.org/2000/svg" font-family="'Oswald', 'Arial Narrow', Arial, sans-serif">
  <defs>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1420" stop-opacity="0.92"/>
      <stop offset="16%" stop-color="#0C1420" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#0C1420" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#0C1420" stop-opacity="0"/>
      <stop offset="90%" stop-color="#0C1420" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0C1420" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="insetClip"><rect x="0" y="0" width="230" height="290"/></clipPath>
  </defs>

  <!-- base: real Sentinel-2 satellite imagery (EOX IT Services, CC BY 4.0), colour-graded to the site palette -->
  <image href="patong-satellite.jpg" x="0" y="0" width="1500" height="1700" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1500" height="1700" fill="#141B2E" fill-opacity="0.28"/>
  <rect x="0" y="0" width="1500" height="1700" fill="url(#topFade)"/>
  <rect x="0" y="0" width="1500" height="1700" fill="url(#bottomFade)"/>

  <!-- title -->
  <text x="60" y="80" fill="#FFFCF8" font-size="40" letter-spacing="3" font-weight="500">DIVA PATONG</text>
  <text x="60" y="112" fill="#E0754A" font-size="15" letter-spacing="5" font-family="'Cormorant', serif" font-style="italic">Worth leaving the pool for</text>

  <!-- disclaimer -->
  <text x="60" y="1636" fill="#F3ECDD" fill-opacity="0.55" font-size="12" letter-spacing="1">SATELLITE IMAGERY: EOX IT SERVICES / SENTINEL-2 CLOUDLESS (CC BY 4.0). MARKER POSITIONS ARE APPROXIMATE.</text>
  <text x="60" y="1656" fill="#F3ECDD" fill-opacity="0.55" font-size="12" letter-spacing="1">CONFIRM ROUTES AND TRAVEL TIMES WITH THE HOTEL WHEN BOOKING A TRANSFER.</text>

  <!-- Phuket island locator inset, top right: real satellite thumbnail, whole island, Patong flagged -->
  <g transform="translate(1210,60)">
    <rect x="-14" y="-14" width="258" height="318" fill="#0C1420" fill-opacity="0.55" stroke="#F3ECDD" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="115" y="8" fill="#F3ECDD" fill-opacity="0.75" font-size="13" letter-spacing="2" text-anchor="middle">PHUKET ISLAND</text>
    <g clip-path="url(#insetClip)" transform="translate(0,18)">
      <image href="phuket-satellite.jpg" x="-70" y="-60" width="420" height="580" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="0" width="230" height="290" fill="#141B2E" fill-opacity="0.25"/>
    </g>
    <!-- Patong marker on inset -->
    <circle cx="93" cy="192" r="6" fill="#E0754A" stroke="#FFFCF8" stroke-width="1.5"/>
    <text x="106" y="197" fill="#FFFCF8" font-size="12" letter-spacing="1">PATONG</text>
  </g>

  <!-- short local connectors: walking distance, no road routing needed -->
  <g stroke="#E0754A" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round">
    <line x1="570" y1="804" x2="548" y2="811"/>   <!-- Patong Beach -->
  </g>

  <!-- real driving routes, computed by OSRM (OpenStreetMap road network) from the hotel to each destination —
       actual roads, not straight lines. Distance/time are OSRM's free-flow estimate, no traffic factored in. -->
  <g fill="none" stroke="#E0754A" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 569.6,804.7 L 574.3,791.8 L 577.1,767.1 L 578.8,736.7 L 580.8,724.7 L 581.8,724.5 L 588.7,727.1 L 599.6,731.7 L 621.7,737.5 L 629.7,743 L 643.4,744.9 L 663.5,751 L 678.7,749.2 L 688.2,745.7 L 699.6,743.7 L 721.3,748.8 L 734.1,750 L 744.6,749.4 L 765.3,746.2 L 771,734.7 L 776.6,730 L 783,728.5 L 780.3,737.6 L 789.1,738.1 L 803.6,729.8 L 816.5,718.2 L 831.2,707.8 L 852.8,689.8 L 865.1,707.1 L 873.1,716 L 868.8,744.3 L 874.2,753.3 L 890.3,758.3 L 901.8,761.6 L 919.5,775.9 L 940.7,779 L 970.6,773.4 L 983.7,778.4 L 983.9,800.2 L 1002.8,801.2 L 1007.8,810.7 L 1015,828.4 L 1018.6,851.3 L 1032.1,866.2 L 1050.4,873.7 L 1047.1,893.2 L 1041.2,912.6 L 1016.1,922.5 L 1012.6,944 L 1026.3,980.5 L 1025.5,999.5 L 1028.9,1013 L 1016.4,1023.8 L 1007.8,1027.9 L 990.3,1025.3 L 983.3,1027 L 965,1040.3 L 953.4,1049.3 L 925.2,1078.4 L 911.2,1093.9 L 889.1,1110.3 L 876.4,1131.3 L 861.2,1156.8 L 862.3,1169.7 L 880.6,1179.8 L 894.4,1185"/> <!-- Wat Chalong -->
    <path d="M 569.6,804.7 L 573.3,797.1 L 577.7,772.5 L 577.3,752.5 L 579.8,726.1 L 581.2,724.1 L 584,726.1 L 592.9,727.2 L 606.1,732.7 L 622.3,738.1 L 629.7,743 L 640.3,742.9 L 660.1,751.2 L 675.9,751.4 L 686.7,742.6 L 695,743.5 L 704.2,744.4 L 726.3,749.2 L 737.1,750.1 L 745.3,749.9 L 765.3,746.2 L 770.8,735.1 L 775.5,730.5 L 781.6,726.7 L 780.5,735.6 L 782.4,739.1 L 796.3,734.9 L 807.2,726.8 L 818.5,715.3 L 834.1,705 L 852.8,689.8 L 861,701.3 L 872.5,713.6 L 868.8,741.7 L 871,750 L 886.1,758.2 L 897.6,757.3 L 904.6,766.6 L 924.5,778.1 L 942.7,778.6 L 970.6,773.4 L 984.2,777.9 L 993.6,779.2 L 1005.2,772.6 L 1027.4,781.8 L 1053.2,770 L 1072.8,794.3 L 1082.5,810.2 L 1099.6,835.7 L 1110,854.7 L 1127.2,862.8 L 1148.3,871.4 L 1154.6,873.3 L 1173.6,869.7 L 1197.8,865.7 L 1213,863.2 L 1229.1,860.3 L 1242.1,856.6 L 1260.1,851.2 L 1274.7,846.3 L 1277.6,872.4 L 1280.4,885.9 L 1281.4,899.4 L 1276.7,904.1 L 1267.6,903.2"/> <!-- Old Phuket Town -->
    <path d="M 569.6,804.7 L 571.7,805.4 L 572,804.3 L 572.4,802.4 L 573.2,797.8 L 574.3,791.8 L 574.7,790 L 574.8,789.5 L 577.5,774.1 L 577.7,772.5 L 578.2,771.1 L 585,772.8 L 586.6,773.2 L 594.1,775.7 L 596.6,776.4 L 600.2,777.2 L 599.5,781.5 L 598.8,785.6 L 597.7,793.4 L 602.2,795.2 L 608,796.4 L 610.3,797.1 L 613.2,798.1 L 614.9,798.8 L 615.8,799.9 L 614.7,805.8 L 614.5,806.9 L 614.2,809.1 L 613.5,813.4 L 613.3,815.3 L 612.8,820.1 L 611.6,827.6 L 611,831.3 L 610.5,835 L 609.8,839.6 L 608.2,845.3 L 606,849.7 L 603.7,854.8 L 602.2,858 L 599.6,863.6 L 596.1,871 L 593.6,876.1 L 590.8,878.4 L 586.8,880.3 L 579.9,882.5 L 574.2,884.5 L 570.1,885.9 L 568.2,886.9 L 565.6,889.1 L 561.7,900.8 L 561.2,902.6 L 557.1,914.6 L 557,916.1 L 557,916.4 L 556.8,916.7 L 555.6,918.1 L 553.1,921.7 L 551.4,923.9 L 544.7,931.3 L 543.1,933.9 L 541.7,937.3 L 540.1,938.8 L 534.7,941.9 L 528.6,945.7 L 527.5,947.3 L 527.6,949 L 527.9,951.3 L 528,953.2 L 527.7,954.9 L 526.8,956.2 L 523.6,959.2 L 519.9,954.3 L 513.9,951 L 503.9,954.3 L 502.5,953.9"/> <!-- Freedom Beach -->
  </g>

  <!-- distance/time labels, from OSRM's road-network calculation (no live traffic factored in) -->
  <g font-size="14" letter-spacing="0.5" fill="#F3ECDD" fill-opacity="0.85">
    <text x="900" y="740" text-anchor="middle">≈15 km · ≈17 min drive</text>
    <text x="1055" y="795" text-anchor="middle">≈18 km · ≈22 min drive</text>
    <text x="600" y="840" text-anchor="start">≈5 km · ≈7 min drive</text>
  </g>

  <!-- destination markers -->
  <g font-size="17" letter-spacing="1" fill="#FFFCF8">
    <circle cx="548" cy="811" r="6" fill="#F3ECDD" stroke="#141B2E" stroke-width="1.5"/>
    <text x="500" y="790" text-anchor="end">PATONG BEACH</text>

    <circle cx="1268" cy="904" r="6" fill="#F3ECDD" stroke="#141B2E" stroke-width="1.5"/>
    <text x="1284" y="898" text-anchor="start">OLD PHUKET<tspan x="1284" dy="20">TOWN</tspan></text>

    <circle cx="893" cy="1183" r="6" fill="#F3ECDD" stroke="#141B2E" stroke-width="1.5"/>
    <text x="909" y="1188" text-anchor="start">WAT CHALONG</text>

    <circle cx="495" cy="943" r="6" fill="#F3ECDD" stroke="#141B2E" stroke-width="1.5"/>
    <text x="448" y="948" text-anchor="end">FREEDOM BEACH</text>
  </g>

  <!-- tight Patong cluster: callout box pulled into open water so labels don't collide -->
  <g>
    <path d="M578,795 C 430,700 300,660 210,650" fill="none" stroke="#E0754A" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="60" y="520" width="330" height="150" fill="#0C1420" fill-opacity="0.6" stroke="#E0754A" stroke-opacity="0.4"/>
    <text x="82" y="556" fill="#E0754A" font-size="12" letter-spacing="2">CENTRAL PATONG</text>
    <circle cx="90" cy="585" r="4" fill="#F3ECDD"/>
    <text x="102" y="590" font-size="15" fill="#FFFCF8">Bangla Road</text>
    <circle cx="90" cy="612" r="4" fill="#F3ECDD"/>
    <text x="102" y="617" font-size="15" fill="#FFFCF8">Jungceylon</text>
    <circle cx="90" cy="639" r="4" fill="#F3ECDD"/>
    <text x="102" y="644" font-size="15" fill="#FFFCF8">Banzaan Market</text>
  </g>

  <!-- Diva Patong hotel — main highlighted marker -->
  <g>
    <circle cx="570" cy="804" r="34" fill="#E0754A" fill-opacity="0.2"/>
    <circle cx="570" cy="804" r="18" fill="#E0754A" fill-opacity="0.4"/>
    <circle cx="570" cy="804" r="9" fill="#E0754A" stroke="#FFFCF8" stroke-width="2.5"/>
    <path d="M570,795 C 480,600 420,520 380,470" fill="none" stroke="#E0754A" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="365" y="460" text-anchor="end" fill="#FFFCF8" font-size="24" letter-spacing="1.5" font-weight="500">DIVA PATONG HOTEL</text>
    <text x="365" y="486" text-anchor="end" fill="#E0754A" font-size="15" letter-spacing="1.5">156 NANAI ROAD, PATONG</text>
  </g>

</svg>
